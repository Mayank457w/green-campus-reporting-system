<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Campus Reporting System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">

    <header>
      <h1>Green Campus Reporting</h1>
      <p class="sub">Spot it. Report it. Track it until it's fixed.</p>
      <div class="tabs">
        <button id="tab-report" class="active">Report</button>
        <button id="tab-admin">Admin</button>
      </div>
    </header>

    <section id="screen-report">
      <div class="panel">
        <h2>New report</h2>

        <label for="category">Problem type</label>
        <select id="category">
          <option>Water leakage</option>
          <option>Overflowing bin</option>
          <option>Electricity waste</option>
          <option>Littering</option>
          <option>Other</option>
        </select>

        <label for="location">Location</label>
        <input id="location" type="text" placeholder="e.g. Block 34, 2nd floor washroom">

        <label for="severity">Severity</label>
        <select id="severity">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>

        <label for="description">What did you see?</label>
        <textarea id="description" placeholder="Tap running since morning"></textarea>

        <label for="photo">Photo (optional, small image)</label>
        <input id="photo" type="file" accept="image/*">

        <button id="submit-btn" class="btn">Submit report</button>
        <p id="message" class="message"></p>
      </div>

      <div class="panel">
        <h2>Reports by type</h2>
        <div id="chart"></div>
      </div>
    </section>

    <section id="screen-admin" class="hidden">
      <div id="stats" class="stats"></div>

      <div class="panel">
        <h2>All reports</h2>
        <div class="filters">
          <select id="filter-category">
            <option value="">All types</option>
            <option>Water leakage</option>
            <option>Overflowing bin</option>
            <option>Electricity waste</option>
            <option>Littering</option>
            <option>Other</option>
          </select>
          <select id="filter-severity">
            <option value="">All severities</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
          <select id="filter-status">
            <option value="">All statuses</option>
            <option>Reported</option>
            <option>In progress</option>
            <option>Resolved</option>
          </select>
          <button id="csv-btn" class="btn alt">Export CSV</button>
        </div>
        <div id="list"></div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
